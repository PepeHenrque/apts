name: Robô da Caixa

# Todo dia baixa a lista oficial de imóveis à venda da Caixa, atualiza public/dados/caixa/
# e faz um commit. O commit diário também mantém o repositório "ativo" (o GitHub desliga
# agendamentos de repositórios sem atividade há 60 dias) e o job acessa o Supabase (evita a
# pausa do plano gratuito).
#
# Configuração (Settings → Secrets and variables → Actions):
#   Variables: CAIXA_UFS (ex.: "SP" ou "SP,MG"), CAIXA_CIDADES (ex.: "Campinas,Sumare"),
#              NOMINATIM_USER_AGENT (opcional)
#   Secrets:   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (opcionais), VAPID_* (avisos)

on:
  schedule:
    - cron: "15 9 * * *" # 06:15 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-caixa
  cancel-in-progress: false

jobs:
  robo:
    name: Buscar imóveis da Caixa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Roda o robô
        id: robo
        run: node scripts/robo-caixa.ts
        env:
          CAIXA_UFS: ${{ vars.CAIXA_UFS || 'SP' }}
          CAIXA_CIDADES: ${{ vars.CAIXA_CIDADES }}
          NOMINATIM_USER_AGENT: ${{ vars.NOMINATIM_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Salva os dados no repositório
        if: always()
        run: |
          git config user.name "apts-robo"
          git config user.email "apts-robo@users.noreply.github.com"
          git add public/dados/caixa dados/geocache-caixa.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore(robo): imóveis da Caixa de $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
