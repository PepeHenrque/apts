name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Commits diários do robô (só dados) não precisam rodar o CI inteiro.
    paths-ignore: ["public/dados/**", "dados/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build-e2e:
    name: Build e testes E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-telas
          path: capturas/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  banco:
    name: Banco (migrations e segurança RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Simula o auth do Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/testes/auth-simulado.sql
      - name: Aplica as migrations
        run: for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Aplica as migrations de novo (devem ser idempotentes)
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Testes de RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/testes/rls.sql

  estatico:
    name: Site estático do app de Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remove as rotas de API (como no app de Windows)
        run: rm -rf src/app/api
      - name: Exporta o site estático
        run: npm run build
        env:
          EXPORTAR_ESTATICO: "1"
          NEXT_PUBLIC_DESKTOP: "1"
      - name: Confere as páginas geradas
        run: |
          for p in index.html situacao/index.html simulador/index.html imoveis/index.html mapa/index.html guias/index.html manifest.webmanifest; do
            test -f "out/$p" || { echo "faltou out/$p"; exit 1; }
          done
          echo "Site estático OK"
